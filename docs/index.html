<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mリーグ速報</title>
<meta name="description" content="Mリーグの日程・順位・個人成績をまとめて見られる非公式ビューア">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mリーグ速報">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1 class="topbar__title" id="title">日程</h1>
    <button class="topbar__refresh" id="refresh" type="button" aria-label="最新データを取得">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <p class="topbar__updated" id="updated">読み込み中…</p>
  </header>

  <main class="content" id="content" tabindex="-1"></main>

  <nav class="tabbar" aria-label="メインメニュー">
    <button class="tab is-active" data-tab="schedule" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>日程</span>
    </button>
    <button class="tab" data-tab="standings" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V13M10 20V5M16 20v-9M21 20H3"/></svg>
      <span>順位</span>
    </button>
    <button class="tab" data-tab="players" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c1.2-3.8 4-5.5 7.5-5.5s6.3 1.7 7.5 5.5"/></svg>
      <span>個人</span>
    </button>
    <button class="tab" data-tab="results" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></svg>
      <span>結果</span>
    </button>
  </nav>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet__backdrop" data-close></div>
  <section class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet__grip" aria-hidden="true"></div>
    <button class="sheet__close" type="button" data-close aria-label="閉じる">×</button>
    <div id="sheet-body"></div>
  </section>
</div>

<div class="tooltip" id="tooltip" role="status" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
