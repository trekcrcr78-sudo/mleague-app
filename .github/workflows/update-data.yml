name: Update M.League data

on:
  schedule:
    # 対局のある夜（19:00〜翌0:55 JST = 10:00〜15:55 UTC）は5分おき
    - cron: "*/5 10-15 * * *"
    # 毎日 3:00 JST にシーズン全月の日程を取り直す
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "全月を取り直す"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Scrape
        run: |
          if [ "${{ github.event.schedule }}" = "0 18 * * *" ] || [ "${{ inputs.full }}" = "true" ]; then
            python scraper/scrape.py --full
          else
            python scraper/scrape.py
          fi
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || (git commit -m "Update data" && git push)
